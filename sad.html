<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sad Story</title>
  <style>
    body {
      background: radial-gradient(circle at top, #0d0d0d, #1a1a1a);
      color: #f2f2f2;
      text-align: center;
      font-family: "Georgia", serif;
      padding: 80px;
      line-height: 1.7;
      animation: fadeIn 2s ease;
    }

    h2 {
      color: #ff5c8d;
      font-size: 2em;
    }

    p {
      font-size: 1.1em;
      max-width: 700px;
      margin: 20px auto;
    }

    a {
      display: inline-block;
      margin-top: 40px;
      padding: 10px 25px;
      color: #fff;
      background-color: #ff5c8d;
      border-radius: 12px;
      text-decoration: none;
      transition: 0.3s;
    }

    a:hover {
      background-color: #e91e63;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h2>💔 The Pain of Letting Go</h2>
  <p>
    He waited… long after everyone stopped believing she’d come back.  
    The sky turned grey, the coffee turned cold,  
    and yet his heart still whispered her name in silence.  
    Some stories don’t end with goodbye — they just fade away, quietly.
  </p>
  <a href="index.html">⬅ Back to Home</a>
</body>
</html>
