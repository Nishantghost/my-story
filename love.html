<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Page</title>
<style>
/* Background gradient animation */
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow: hidden;
    color: white;
}

@keyframes gradientBG {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

/* Page text */
h1 { font-size: 3em; margin-bottom: 20px; }
p { font-size: 1.5em; margin-bottom: 40px; }

/* Hearts falling effect */
.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    clip-path: polygon(50% 0%, 61% 15%, 75% 15%, 85% 25%, 85% 40%, 50% 100%, 15% 40%, 15% 25%, 25% 15%, 39% 15%);
    animation: fall 5s linear infinite;
}

@keyframes fall {
    0% {transform: translateY(-50px) rotate(0deg);}
    100% {transform: translateY(600px) rotate(360deg);}
}

/* Music button styling */
button {
    padding: 15px 30px;
    font-size: 1em;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: white;
    color: #ff4a79;
    font-weight: bold;
}
button:hover { background-color: #ff4a79; color: white; }
</style>
</head>
<body>

<!-- Page content -->
<h1>Feel the Love ❤</h1>
<p>Love makes everything more beautiful. Enjoy this moment!</p>

<!-- Background music -->
<audio id="loveMusic" loop autoplay>
    <source src="C:\Users\rakhi\Downloads\love-romantic-hopeful-music-333017.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Play/Pause button -->
<button onclick="toggleMusic()">🎵 Play/Pause Music</button>

<script>
// Music control
const music = document.getElementById('loveMusic');
function toggleMusic() {
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}

// Falling hearts effect
function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.animationDuration = (3 + Math.random() * 5) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 500);
</script>

</body>
</html>
